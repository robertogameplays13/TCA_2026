<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Metida critica</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<header>
    <h1>Metida Crítica</h1>
    <!--quando colocar a imagem da logo fazer ela voltar pra pagina inicial-->
    <a href="index.html" class="return-button">← Retornar</a>
</header>
<body>
    <main>
        <form id="loginForm">    
            <input type="text" id="name-login" placeholder="Nome da conta" required>
            <input type="email" id="email-login" placeholder="Seu Email" required>
            <input type="password" id="senha-login" placeholder="Sua senha" required>
            <button type="submit" id="submitBtn">Sign in</button>
        </form>
    </main>
</body>
<footer></footer>
<script src="js/login.js"></script>
</html>
