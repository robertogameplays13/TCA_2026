<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo - Metida Crítica</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="container-header">
        <a href="index.html">
        <img src="imgs/logo_site.jpg" alt="Logo metida critica" width="240">
        </a>
        <div class="header-acoes">
            <a href="index.html" class="return-button">← Retornar</a>
            <a href="login.html" class="login-button">Criar Conta</a>
        </div>
    </header>

    <main class="container">
        <aside class="coluna-esquerda">
            <h3>Desenvolvedora</h3>
            <div id="dados-empresa">Carregando...</div>
        </aside>

        <section class="coluna-principal">
            <div id="detalhes-jogo">Carregando...</div>
        </section>

        <aside class="coluna-direita">
            <h3>Reviews Recentes</h3>
            <div id="reviews-recentes">Carregando...</div>
        </aside>
    </main>

    <section class="bloco-separado linha-embaixo">
        <h3>Avaliar este jogo</h3>

        <form id="loginReviewForm">
            <p class="texto-suave">Entre com sua conta para avaliar (ou <a href="login.html">crie uma aqui</a>):</p>
            <input type="email" id="email-review" placeholder="Seu Email" required>
            <input type="password" id="senha-review" placeholder="Sua Senha" required>
            <button type="submit">Entrar para Avaliar</button>
            <p id="msg-login-review" class="msg-aviso"></p>
        </form>

        <form id="reviewForm" style="display: none;">
            <p id="usuario-logado-texto" class="status-logado"></p>
            <input type="number" id="nota-review" min="0" max="10" placeholder="Nota (0 a 10)" required>
            <textarea id="conteudo-review" rows="3" placeholder="Escreva sua review..." required></textarea>
            <button type="submit">Publicar Review</button>
        </form>
    </section>

    <section class="bloco-separado linha-embaixo">
        <h3>Reviews da Galera</h3>
        <div class="lista-reviews" id="lista-reviews">Carregando reviews...</div>
    </section>

    <footer>
        <p>Metida Crítica</p>
    </footer>

    <script src="js/jogo.js"></script>
</body>
</html>
